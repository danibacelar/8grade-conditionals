<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Conditionals Quest</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#dfe3ec;--zero:#0f9d8a;--first:#2563eb;--second:#e8710a;--third:#7c3aed;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--mu:#9aa4b8;--bd:#2f3748;--zero:#2dd4bf;--first:#60a5fa;--second:#fb9a3c;--third:#a78bfa;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#eef1f7;--mu:#9aa4b8;--bd:#2f3748;--zero:#2dd4bf;--first:#60a5fa;--second:#fb9a3c;--third:#a78bfa;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.steps{display:flex;gap:4px;flex:1;min-width:220px;overflow-x:auto}
.step{font:inherit;cursor:pointer;font-size:12px;padding:4px 8px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.step.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.step.done{color:var(--ok);border-color:var(--ok)}
.score{font-weight:700;background:var(--card);border:1px solid var(--bd);padding:4px 12px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 4px}.mu{color:var(--mu);font-size:14px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px}
.btn:hover{border-color:var(--tx)}.pri{background:var(--first);color:#fff;border-color:var(--first);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tp{border-left:5px solid;border-radius:10px;padding:10px 12px;background:var(--bg)}
.tp b{display:block}.tp code{display:block;font-size:13px;margin:4px 0;color:var(--mu)}
.zero{border-color:var(--zero)}.first{border-color:var(--first)}.second{border-color:var(--second)}.third{border-color:var(--third)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chip{background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:7px 11px;cursor:grab;font-size:15px;user-select:none}
.chip.sel{outline:3px solid var(--first)}
.bks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.bk{border:2px dashed;border-radius:12px;padding:8px;min-height:90px;cursor:pointer}
.bk.over{background:var(--bg)}.bk small{display:block;color:var(--mu);font-size:12px;margin-bottom:4px}
.bk .p{font-size:13px;padding:4px 6px;margin-top:4px;border-radius:6px;background:var(--bg)}
.fb{min-height:24px;margin:10px 0;font-weight:600}.ok{color:var(--ok)}.no{color:var(--no)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--no);color:#fff;border-color:var(--no)}
.row{padding:10px 0;border-bottom:1px solid var(--bd)}.row .bs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bs .btn{padding:5px 10px;font-size:13px}.bs .good{background:var(--ok);color:#fff;border-color:var(--ok)}.bs .bad{background:var(--no);color:#fff;border-color:var(--no)}
.ans{min-height:52px;border:2px dashed var(--bd);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.big{font-size:20px}
.hero{border-radius:18px;padding:26px 18px;margin-bottom:12px;color:#fff;text-align:center;background:linear-gradient(120deg,#7c3aed,#2563eb,#0f9d8a,#e8710a,#7c3aed);background-size:300% 300%;animation:bg 8s ease infinite}
.hero h1{font-size:clamp(26px,7vw,40px);letter-spacing:1px;margin:0 0 6px}.hero p{margin:0;font-size:18px}
@keyframes bg{50%{background-position:100% 50%}}
.fl{cursor:pointer;border-radius:14px;padding:14px;text-align:center;border:2px solid;transition:transform .15s;user-select:none}
.fl:hover{transform:scale(1.04) rotate(-1deg)}.fl.zero{background:color-mix(in srgb,var(--zero) 18%,var(--card))}.fl.first{background:color-mix(in srgb,var(--first) 18%,var(--card))}.fl.second{background:color-mix(in srgb,var(--second) 18%,var(--card))}.fl.third{background:color-mix(in srgb,var(--third) 18%,var(--card))}
.fl .em{font-size:38px}.fl b{display:block;font-size:17px;letter-spacing:.5px}.fl .more{display:none;margin-top:8px;font-size:14px}.fl.on .more{display:block}.fl .more code{display:block;font-weight:700;margin-bottom:4px}
.trick{background:var(--bg);border-radius:12px;padding:10px 12px;margin:12px 0 0}.trick span{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;margin:2px;font-weight:600}
.lv{font:inherit;cursor:pointer;color:var(--tx);text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;transition:transform .15s,border-color .15s}
.lv:hover{transform:translateY(-3px);border-color:var(--first)}.lv .em{font-size:30px;display:block}.lv b{font-size:17px}.lv small{display:block;color:var(--mu)}
.surp{width:100%;margin-top:10px;font-size:17px;padding:12px}
.pop{position:fixed;left:50%;top:35%;font-size:34px;font-weight:800;color:#f59e0b;pointer-events:none;z-index:99;animation:pp 1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
@keyframes pp{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px)}}
.cf{position:fixed;top:-30px;pointer-events:none;z-index:98;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.8}}
.bar{height:14px;background:var(--bg);border-radius:99px;overflow:hidden;margin:8px 0 12px;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--first),var(--third));transition:width .4s}
.chip,.opt,.bs .btn{transition:transform .12s}.chip:hover,.opt:hover,.bs .btn:hover{transform:scale(1.04)}.opt{font-size:18px;padding:12px 14px}.card h2{font-size:22px}
</style></head><body><div class="w"><div class="top"><div class="steps" id="steps"></div><div class="score" id="sc">⭐ 0</div></div><div id="app"></div></div>
<script>
const $=s=>document.querySelector(s);
const T={zero:{n:'Zero',f:'If/When + present simple → present simple',u:'always true / facts'},first:{n:'First',f:'If + present simple → will + verb',u:'real possibility in the future'},second:{n:'Second',f:'If + past simple → would + verb',u:'imaginary present/future'},third:{n:'Third',f:'If + past perfect → would have + past participle',u:'imaginary past (too late!)'}};
const S={sc:0,st:0,str:0,vis:{},miss:{zero:0,first:0,second:0,third:0,none:0}};
const names=['Rules','Sort','Choose','Detective','Build','Speak','Result'],mins=[5,8,8,7,6,6,''];
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const app=h=>$('#app').innerHTML=h;
function head(){$('#steps').innerHTML=names.map((n,i)=>`<button class="step ${i==S.st?'on':S.vis[i]?'done':''}" onclick="go(${i})">${n}${mins[i]?' · '+mins[i]+'′':''}</button>`).join('');$('#sc').textContent='⭐ '+S.sc+(S.str>1?' 🔥'+S.str:'')}
const add=(n,t)=>{S.sc+=n;if(t){S.miss[t]++;S.str=0}else if(n>0){S.str++;fx('+'+n+' ⭐');boom(10);if([3,5,8,12].includes(S.str))setTimeout(()=>fx('🔥 '+S.str+' in a row!'),600)}head()};
function fx(m){const d=document.createElement('div');d.className='pop';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function boom(n){const e=['🎉','⭐','✨','💥','🔥','🌟'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.3+'s';s.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1900)}}
function bar(d,t){return `<div class="bar"><i style="width:${d/t*100}%"></i></div>`}
const nextBtn=()=>{setTimeout(()=>{boom(50);fx('🎉 LEVEL CLEAR!')},80);return `<button class="btn pri" style="width:100%;padding:14px;font-size:18px" onclick="go(S.st+1)">🎉 Level clear! Next →</button>`};
function go(i){S.st=i;S.vis[i]=1;head();[intro,sort,mc,detect,build,speak,end][i]();scrollTo(0,0)}
function typeCards(){return '<div class="grid">'+Object.keys(T).map(k=>`<div class="tp ${k}"><b>${T[k].n} conditional</b><code>${T[k].f}</code><span class="mu">${T[k].u}</span></div>`).join('')+'</div>'}

function introOld(){app(`<div class="card"><h1>🕵️ Conditionals Quest</h1><p class="mu">Zero · First · Second · Third — and <i>unless</i>. Earn ⭐ in 6 stages.</p>${typeCards()}
<p><b>Memory trick:</b> look at the <u>verb in the if-part</u>. <b>Present</b> → zero or first. <b>Past simple</b> → second. <b>Past perfect (had + pp)</b> → third.</p>
<p class="mu"><b>unless</b> = <b>if … not</b>. “Unless you hurry, you’ll be late” = “If you don’t hurry, you’ll be late”.</p>
<p class="mu">Examples: If you feed wild birds, they become dependent (zero). If you watch the video, you’ll see… (first). If you saw a shoplifter, what would you do? (second). If technicians hadn’t identified the problem, the rats would have eaten… (third).</p>
<h2>Choose a stage (any order)</h2><div class="grid">${[['1 · Sort','Drag sentences to the right conditional'],['2 · Choose','Multiple choice: right verb form'],['3 · Detective','Find conditionals in a text'],['4 · Build','Put the words in order'],['5 · Speak','Say sentences out loud'],['Result','See score & mistakes']].map((m,i)=>`<button class="btn" style="text-align:left" onclick="go(${i+1})"><b>${m[0]}</b><br><span class="mu">${m[1]}</span></button>`).join('')}</div></div>`)}

function intro(){
 const C=[['zero','⚡','ALWAYS TRUE','IF + present → present','If you heat ice, it melts.'],['first','🔮','REAL FUTURE','IF + present → WILL','If you click it, you’ll lose your data.'],['second','🦄','IMAGINE IT','IF + past → WOULD','If I won the lottery, I’d buy a house.'],['third','⏪','TOO LATE','IF + had + pp → WOULD HAVE + pp','If I had studied, I would have passed.']];
 const L=[['🧩','Sort','Drag & drop','1'],['🎯','Choose','Pick the form','2'],['🔍','Detective','Find them in a text','3'],['🧱','Build','Make the sentence','4'],['🎤','Speak','Say it out loud','5']];
 app(`<div class="hero"><h1>🎮 CONDITIONALS QUEST</h1><p>Crack 4 secret codes. Catch the hacker. 🕵️</p></div>
 <div class="card"><h2>🔐 The 4 codes <span class="mu">· tap to flip</span></h2><div class="grid">${C.map(c=>`<div class="fl ${c[0]}" onclick="this.classList.toggle('on')"><div class="em">${c[1]}</div><b style="font-size:19px;color:var(--${c[0]})">${T[c[0]].n.toUpperCase()} CONDITIONAL</b><span class="mu" style="font-weight:600">${c[2]}</span><div class="more"><code>${c[3]}</code>“${c[4]}”</div></div>`).join('')}</div>
 <p class="trick">🧠 <b>Cheat code:</b> check the verb after IF → <span>present = 0 or 1</span> <span>past = 2</span> <span>had + pp = 3</span></p></div>
 <div class="card"><h2>🎯 Pick your level <span class="mu">· any order, 5 min each</span></h2><div class="grid">${L.map(l=>`<button class="lv" onclick="go(${l[3]})"><span class="em">${l[0]}</span><b>${l[1]}</b><small>${l[2]}</small></button>`).join('')}</div>
 <button class="btn pri surp" onclick="go(1+Math.floor(Math.random()*5))">🎲 Surprise me!</button>
 <p style="text-align:center;margin:10px 0 0"><button class="btn" onclick="introOld()">📖 Full cheat sheet</button></p></div>`)}

/* STAGE 1: SORT */
const SORT=[["If you heat ice, it melts.","zero"],["When you mix red and blue, you get purple.","zero"],["Water boils if you heat it to 100°C.","zero"],["If it rains tomorrow, we’ll stay home.","first"],["If you click that link, you’ll lose your password.","first"],["Unless you hurry, you’ll miss the bus.","first"],["If I won the lottery, I would buy a house.","second"],["If I were you, I’d call the police.","second"],["If nobody used passwords, hackers wouldn’t need to hack.","second"],["If I had seen the thief, I would have called the police.","third"],["If they hadn’t clicked the link, they wouldn’t have lost money.","third"],["If she had checked the CCTV, she would have found the thieves.","third"]].map(([s,t],i)=>({s,t,i}));
let sel=null,placed={},tried={};
function sort(){sel=null;placed={};tried={};drawSort('Tap a sentence, then tap its box (or drag it).')}
function drawSort(msg,cls){
 if(!window._o)window._o=sh(SORT.map(x=>x.i));
 const pool=window._o.filter(i=>!(i in placed));
 app(`<div class="card"><h2>🧩 Sort it! <span class="mu">${Object.keys(placed).length}/12</span></h2>${bar(Object.keys(placed).length,12)}<p class="mu">Drag each sentence to its box.</p>
 <div class="pool">${pool.map(i=>`<div class="chip ${sel===i?'sel':''}" draggable="true" data-i="${i}">${SORT[i].s}</div>`).join('')}</div>
 <div class="fb ${cls||''}">${msg}</div>
 <div class="bks">${Object.keys(T).map(k=>`<div class="bk ${k}" data-t="${k}"><b>${T[k].n}</b><small>${T[k].f}</small>${Object.keys(placed).filter(i=>placed[i]===k).map(i=>`<div class="p">${SORT[i].s}</div>`).join('')}</div>`).join('')}</div>
 ${pool.length?'':'<p>'+nextBtn()+'</p>'}</div>`);
 document.querySelectorAll('.chip').forEach(c=>{c.onclick=()=>{sel=+c.dataset.i;drawSort(msg,cls)};c.ondragstart=e=>{sel=+c.dataset.i;e.dataTransfer.setData('text','x')}});
 document.querySelectorAll('.bk').forEach(b=>{b.onclick=()=>place(b.dataset.t);b.ondragover=e=>{e.preventDefault();b.classList.add('over')};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();place(b.dataset.t)}});
}
function place(t){
 if(sel===null)return drawSort('Pick a sentence first 👆');
 const it=SORT[sel];
 if(it.t===t){placed[sel]=t;if(!tried[sel])add(10);sel=null;drawSort('✅ Yes!','ok')}
 else{tried[sel]=1;add(0,it.t);drawSort(`💪 Not ${T[t].n}. Remember: ${T[t].f}. Does the sentence match? Check the verbs!`,'no');document.querySelector('.fb').classList.add('shake')}
}

/* STAGE 2: MULTIPLE CHOICE */
const MC=[
["If I ___ a hacker, I would report him.",["see","saw","had seen"],1,"second","If + past simple → would + verb. Situação imaginária."],
["If you click on that link, you ___ your password.",["will lose","would lose","would have lost"],0,"first","If + present → will. Possibilidade real no futuro."],
["If she ___ her password, the hacker wouldn’t have got in.",["hadn’t shared","didn’t share","doesn’t share"],0,"third","would have → o if-part usa past perfect (had + pp). Passado imaginário."],
["When you heat ice, it ___.",["will melt","melts","would melt"],1,"zero","Fato sempre verdadeiro: present + present."],
["What would you do if you ___ a scam email?",["get","got","will get"],1,"second","would na pergunta → if + past simple."],
["If we hadn’t left early, we ___ the train.",["would miss","will miss","would have missed"],2,"third","had + pp → would have + pp."],
["If it ___ tomorrow, I’ll go to the beach.",["doesn’t rain","won’t rain","didn’t rain"],0,"first","Nunca use will no if-part. Present simple."],
["___ you protect yourself, you’ll become a victim.",["Unless","If","When"],0,"first","Unless = if … not (aqui: if you don’t protect yourself)."],
["Rewrite: “If you don’t study, you won’t pass.”",["Unless you study, you won’t pass.","Unless you don’t study, you won’t pass.","Unless you studied, you won’t pass."],0,"first","Unless já é negativo — nunca use unless + don’t."],
["If I ___ rich, I would travel the world.",["am","were","would be"],1,"second","Second conditional: if + past simple (I were / I was)."]
];
let mi=0,mTried=false;
function mc(){mi=0;drawMC()}
function drawMC(){
 mTried=false;const q=MC[mi];
 app(`<div class="card"><h2>🎯 Choose! <span class="mu">${mi+1}/${MC.length}</span></h2>${bar(mi,MC.length)}<p class="big">${q[0]}</p>
 ${q[1].map((o,i)=>`<button class="btn opt" data-i="${i}">${o}</button>`).join('')}<div class="fb" id="fb"></div><div id="nx"></div></div>`);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i;
  if(i===q[2]){b.classList.add('good');if(!mTried)add(10);$('#fb').innerHTML=`<span class="ok">✅ ${T[q[3]].n} conditional.</span> <span class="mu">${q[4]}</span>`;
   $('#nx').innerHTML=mi<MC.length-1?`<button class="btn pri" onclick="mi++;drawMC()">Next question →</button>`:nextBtn();document.querySelectorAll('.opt').forEach(x=>x.disabled=true)}
  else{b.classList.add('bad');b.disabled=true;mTried=true;add(0,q[3]);$('#fb').innerHTML='<span class="no">💪 Almost! Check the verb in the if-part.</span>'}
 })
}

/* STAGE 3: DETECTIVE */
const DET=[["Last week, Maria got a strange email.","none"],["If you click on a link in a phishing email, hackers can steal your login details.","zero"],["Maria says: “If I hadn’t opened the attachment, I wouldn’t have lost my money.”","third"],["She’ll report the scam if the bank calls her tomorrow.","first"],["Her brother is a police officer.","none"],["He says, “If I were you, I’d change all my passwords.”","second"],["Unless people protect themselves, fraudsters will keep winning.","first"],["If nobody used the internet, there would be no cyber-crime.","second"]];
let dd={};
function detect(){dd={};drawDet()}
function drawDet(){
 const opts=['none','zero','first','second','third'];
 app(`<div class="card"><h2>🔍 Detective <span class="mu">${Object.values(dd).filter(x=>x.ok).length}/${DET.length}</span></h2>${bar(Object.values(dd).filter(x=>x.ok).length,DET.length)}<p class="mu">Which type is each sentence?</p>
 ${DET.map((d,i)=>`<div class="row"><div>${d[0]}</div><div class="bs">${opts.map(o=>`<button class="btn ${dd[i]&&dd[i].ok===o?'good':dd[i]&&dd[i].bad&&dd[i].bad.includes(o)?'bad':''}" data-i="${i}" data-o="${o}">${o==='none'?'Not a conditional':T[o].n}</button>`).join('')}</div></div>`).join('')}
 <div class="fb">${Object.values(dd).filter(x=>x.ok).length}/${DET.length} found</div>${Object.values(dd).filter(x=>x.ok).length===DET.length?nextBtn():''}</div>`);
 document.querySelectorAll('.bs .btn').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,o=b.dataset.o;dd[i]=dd[i]||{bad:[]};if(dd[i].ok)return;
  if(o===DET[i][1]){dd[i].ok=o;if(!dd[i].bad.length)add(10)}else{dd[i].bad.push(o);add(0,DET[i][1])}
  drawDet()})
}

/* STAGE 4: BUILD */
const BLD=[["If I saw a shoplifter, I would call the police.","second"],["If you feed the birds, you will pay a fine.","first"],["If they had checked the CCTV, they would have found the thief.","third"],["If you heat water to 100 degrees, it boils.","zero"]];
let bi=0,bank=[],ans=[],bTried=0;
function build(){bi=0;drawB(true)}
function drawB(fresh){
 const it=BLD[bi];if(fresh){bank=sh(it[0].split(' ').map((w,i)=>({w,i})));ans=[];bTried=0}
 app(`<div class="card"><h2>🧱 Build it! <span class="mu">${bi+1}/${BLD.length}</span></h2>${bar(bi,BLD.length)}<p class="mu">Tap the words in order. Type: <b>${T[it[1]].n} conditional</b> — ${T[it[1]].f}</p>
 <div class="ans" id="an">${ans.map(x=>`<span class="chip" data-r="${x.i}">${x.w}</span>`).join('')}</div>
 <div class="pool">${bank.map(x=>`<span class="chip" data-a="${x.i}">${x.w}</span>`).join('')}</div>
 <p><button class="btn pri" id="ck">Check ✓</button> <button class="btn" id="rs">Reset</button></p><div class="fb" id="fb"></div><div id="nx"></div></div>`);
 document.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>{const x=bank.find(b=>b.i==c.dataset.a);bank=bank.filter(b=>b!==x);ans.push(x);drawB()});
 document.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{const x=ans.find(b=>b.i==c.dataset.r);ans=ans.filter(b=>b!==x);bank.push(x);drawB()});
 $('#rs').onclick=()=>drawB(true);
 $('#ck').onclick=()=>{if(ans.map(x=>x.w).join(' ')===it[0]){if(!bTried)add(15);$('#fb').innerHTML='<span class="ok">✅ Perfect!</span>';$('#nx').innerHTML=bi<BLD.length-1?`<button class="btn pri" onclick="bi++;drawB(true)">Next →</button>`:nextBtn()}else{bTried=1;add(0,it[1]);$('#fb').innerHTML='<span class="no">❌ Not yet. Which part has the if-clause verb? Which has would/will?</span>'}}
}

/* STAGE 5: SPEAK */
const SP=[["second","what you would do if you won a million reais"],["first","what will happen if it rains this weekend"],["third","something you regret from last week"],["zero","what happens if you don’t sleep"],["second","what you would do if you were the president"],["third","a mistake someone made online (clicked a link, shared a password…)"],["first","what you will do if you get a scam message"],["second","what you would say if a friend was bullied online"]];
let pi=0;
function speak(){pi=0;drawSp()}
function drawSp(){
 const p=SP[pi];
 app(`<div class="card"><h2>🎤 Speak! <span class="mu">${pi+1}/${SP.length}</span></h2>${bar(pi,SP.length)}<p class="mu">Teacher judges: right type + right verb forms?</p>
 <div class="tp ${p[0]}"><b class="big">Say a ${T[p[0]].n.toUpperCase()} conditional about:</b><span>${p[1]}</span><code>${T[p[0]].f}</code></div><br>
 <button class="btn pri" id="y">✔ Nailed it (+15)</button> <button class="btn" id="h">Almost (+5)</button> <button class="btn" id="n">✘ Wrong type</button>
 <div class="fb mu">Tip: hide the formula by asking the student to think first.</div></div>`);
 const nx=()=>pi<SP.length-1?(pi++,drawSp()):go(6);
 $('#y').onclick=()=>{add(15);nx()};$('#h').onclick=()=>{add(5);nx()};$('#n').onclick=()=>{add(0,p[0]);nx()};
}

/* END */
function end(){setTimeout(()=>boom(60),100);
 const m=Object.entries(S.miss).filter(([k])=>k!=='none').sort((a,b)=>b[1]-a[1]);
 const w=m[0][1]>0?`Review next class: <b>${T[m[0][0]].n} conditional</b> (${m[0][1]} mistakes) — ${T[m[0][0]].f}`:'No mistakes. Wow!';
 app(`<div class="card"><h1>🏆 Final score: ${S.sc} ⭐</h1><p>${w}</p>
 <h2>Mistakes by type</h2><div class="grid">${m.map(([k,v])=>`<div class="tp ${k}"><b>${T[k].n}</b><span class="big">${v}</span></div>`).join('')}</div>
 <p class="mu">Homework idea: write 2 sentences for each type, about cyber-crime.</p><button class="btn pri" onclick="location.reload()">Play again</button></div>`)
}
go(0);
</script></body></html>
